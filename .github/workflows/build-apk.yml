name: Build debug APK (manual)

# Unsigned debug build for quick testing. The signed release build lives in
# build-release.yml and runs automatically on every push.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fuelgo-driver-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
